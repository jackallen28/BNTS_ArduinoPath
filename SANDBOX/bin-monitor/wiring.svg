<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">BNTS smart bin: ESP32 DevKit wiring</title>
<desc id="desc">Schematic connection guide. HC-SR04 VCC to 5V, TRIG to GPIO5, ECHO through a 1 kiloohm resistor to GPIO18 with a 2 kiloohm resistor from that node to ground. Lid reed switch between GPIO19 and ground. All grounds common.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#203642}.title{font-size:34px;font-weight:700;fill:#704988}.sub{font-size:19px;fill:#506773}.heading{font-size:25px;font-weight:700}.label{font-size:21px}.small{font-size:17px}.note{font-size:19px}.pin{font-size:21px;font-family:Consolas,monospace;font-weight:700}.wire{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.resistor{fill:#fff;stroke:#704988;stroke-width:3}.ground{stroke:#203642;stroke-width:3;fill:none}.dot{fill:#203642}
</style></defs>
<rect width="1440" height="1050" fill="#f4f8fa"/>
<rect x="0" y="0" width="1440" height="12" fill="#19c1ca"/>
<text x="50" y="68" class="title">Smart bin · ESP32 wiring</text>
<text x="50" y="105" class="sub">Schematic connection guide · classic ESP32 DevKit · pin positions are illustrative</text>
<rect x="50" y="128" width="1340" height="60" rx="9" fill="#fff2df" stroke="#d79538"/>
<text x="72" y="166" class="label" font-weight="700">HC-SR04 ECHO is 5 V. Use the divider shown — never connect it directly to an ESP32 GPIO.</text>

<rect x="70" y="225" width="340" height="435" rx="14" fill="#e7f7f8" stroke="#208e99" stroke-width="3"/>
<text x="100" y="270" class="heading">ESP32 DevKit</text>
<text x="100" y="300" class="small">3.3 V GPIO logic</text>
<rect x="110" y="330" width="140" height="190" rx="8" fill="#d6e3e8" stroke="#72929e"/>
<text x="180" y="424" text-anchor="middle" class="label" fill="#506773">ESP32</text>
<text x="390" y="287" text-anchor="end" class="pin">5V / VIN</text>
<text x="390" y="357" text-anchor="end" class="pin">GPIO5</text>
<text x="390" y="437" text-anchor="end" class="pin">GPIO18</text>
<text x="390" y="547" text-anchor="end" class="pin">GPIO19</text>
<text x="390" y="627" text-anchor="end" class="pin">GND</text>
<rect x="180" y="600" width="80" height="45" rx="4" fill="#fff" stroke="#7795a1"/>
<text x="220" y="628" text-anchor="middle" class="small">USB</text>

<rect x="1070" y="225" width="300" height="335" rx="14" fill="#e7f7f8" stroke="#208e99" stroke-width="3"/>
<text x="1175" y="267" class="heading">HC-SR04</text>
<text x="1150" y="545" class="small">Distance sensor</text>
<circle cx="1190" cy="360" r="33" fill="#d6e3e8" stroke="#72929e" stroke-width="3"/>
<circle cx="1290" cy="360" r="33" fill="#d6e3e8" stroke="#72929e" stroke-width="3"/>
<text x="1090" y="287" class="pin">VCC</text>
<text x="1090" y="357" class="pin">TRIG</text>
<text x="1090" y="437" class="pin">ECHO</text>
<text x="1090" y="517" class="pin">GND</text>

<!-- Supply and trigger -->
<path d="M410 280 H1070" class="wire" stroke="#c75249"/>
<text x="655" y="264" class="small" fill="#a73530">5 V supply</text>
<path d="M410 350 H1070" class="wire" stroke="#149ca8"/>
<text x="645" y="334" class="small">Trigger signal</text>

<!-- ECHO divider: upper 1k, lower 2k -->
<path d="M410 430 H815 M955 430 H1070" class="wire" stroke="#704988"/>
<rect x="815" y="416" width="140" height="28" class="resistor"/>
<text x="885" y="405" text-anchor="middle" class="label" fill="#704988">R1 · 1 kΩ</text>
<circle cx="720" cy="430" r="7" fill="#704988"/>
<path d="M720 430 V515 M720 615 V720" class="wire" stroke="#704988"/>
<rect x="706" y="515" width="28" height="100" class="resistor"/>
<text x="752" y="557" class="label" fill="#704988">R2 · 2 kΩ</text>
<text x="752" y="585" class="small">to common ground</text>
<text x="488" y="464" class="small">≈ 3.3 V at GPIO18</text>
<text x="856" y="474" class="small">5 V echo from sensor</text>

<!-- Lid switch and common ground -->
<path d="M410 540 H485 M565 540 H605 V720" class="wire" stroke="#d28530"/>
<circle cx="485" cy="540" r="5" fill="#d28530"/>
<circle cx="565" cy="540" r="5" fill="#d28530"/>
<path d="M485 540 L558 518" class="wire" stroke="#d28530"/>
<text x="447" y="592" class="small">Reed switch</text>
<text x="445" y="616" class="small">(lid sensor)</text>
<path d="M410 620 H435 V720 H1010 V510 H1070" class="wire" stroke="#314b58"/>
<circle cx="605" cy="720" r="6" class="dot"/>
<circle cx="720" cy="720" r="6" class="dot"/>
<path d="M720 720 V748 M695 748 H745 M702 758 H738 M710 768 H730" class="ground"/>
<text x="801" y="703" class="label">Common GND</text>

<rect x="50" y="800" width="1340" height="200" rx="10" fill="#fff" stroke="#c4d3dc"/>
<text x="75" y="836" class="heading" fill="#704988">Before powering on</text>
<text x="75" y="873" class="note">• Lid switch closes to GND when the lid is closed; GPIO19 uses the internal pull-up.</text>
<text x="75" y="906" class="note">• Confirm your board’s 5V/VIN pin and GPIO labels. This is a connection schematic, not a physical pinout.</text>
<text x="75" y="939" class="note">• Use USB power or a suitable regulated supply. Wi-Fi needs no USB data cable after the first upload.</text>
<text x="75" y="972" class="note">• Do not combine external power and USB unless your board’s power circuit explicitly supports it.</text>
<text x="50" y="1030" class="small">BNTS · Bin Monitor · Disconnect power before wiring · Real wiring, sensor calibration and Wi-Fi need hardware testing</text>
</svg>
