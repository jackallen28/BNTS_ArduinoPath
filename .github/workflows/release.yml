# Publishes ArduinoPath for Windows and macOS as a GitHub release. Any of
# these starts it:
#   - changing the VERSION file (on github.com: open VERSION, edit, commit)
#   - pushing a version tag:  git tag v1.2.3 && git push origin v1.2.3
#   - making a release with a new v1.2.3 tag on github.com
#   - Actions > Release > Run workflow (publishes VERSION if it isn't out yet),
#     or a change to this file
# Each app is tested on its own system (started and used) before anything
# is published: ArduinoPath.exe (64-bit Intel/AMD), ArduinoPath-arm64.exe,
# ArduinoPath-macOS.zip (one app for Intel and Apple Silicon Macs) and SHA256SUMS.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time (a release made on github.com can start this twice).
concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(tr -d ' \r\n' < VERSION)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a version like v1.2.3 (VERSION should hold just 1.2.3)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A VERSION change for a version that's already out does nothing.
          if [[ "$GITHUB_REF" != refs/tags/* ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Restore the board tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Install the board tools
        run: |
          go run ./cmd/arduinopath -data "$RUNNER_TEMP/cp" -install-arduino
          rm -rf "$RUNNER_TEMP/cp/arduino/downloads"

      - name: Save the board tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Build (with the board tools built in)
        run: |
          mkdir -p dist
          go run ./tools/packboards -in "$RUNNER_TEMP/cp/arduino" -out "$RUNNER_TEMP/boards.zip"
          for arch in amd64 arm64; do
            out=dist/ArduinoPath.exe
            [ "$arch" = arm64 ] && out=dist/ArduinoPath-arm64.exe
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-H windowsgui -s -w -X arduinopath.Version=$VERSION" -o "$out" ./cmd/arduinopath
            # The tools run as x64 on ARM laptops too (Windows emulates them).
            go run ./tools/packboards -append "$out" -bundle "$RUNNER_TEMP/boards.zip"
          done
          ls -la dist

      - name: Unpack the built-in tools and compile for every board
        env:
          ARDUINOPATH_BOARDS: ${{ github.workspace }}/dist/ArduinoPath.exe
        run: go test -v -timeout 120m -run TestRealBundle ./internal/arduino

      - name: Start ArduinoPath.exe and use it
        shell: pwsh
        env:
          ARDUINOPATH_EXPECT_TOOLS: "1"
        run: ./tests/windows/smoke.ps1 -Exe dist/ArduinoPath.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          retention-days: 3

  macos:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Restore the board tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Install the board tools
        run: |
          go run ./cmd/arduinopath -data "$RUNNER_TEMP/cp" -install-arduino
          rm -rf "$RUNNER_TEMP/cp/arduino/downloads"

      - name: Save the board tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cp/arduino
          key: arduino-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/arduino/requirements.json') }}

      - name: Build (with the board tools built in)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X arduinopath.Version=$VERSION" -o dist/arduinopath-$arch ./cmd/arduinopath
          done
          go run ./tools/packboards -in "$RUNNER_TEMP/cp/arduino" -out "$RUNNER_TEMP/boards.zip"
          go run ./tools/macapp -version "$VERSION" -amd64 dist/arduinopath-amd64 -arm64 dist/arduinopath-arm64 -boards "$RUNNER_TEMP/boards.zip" -out dist
          codesign --force --deep -s - dist/ArduinoPath.app

      - name: Unpack the built-in tools and compile for every board
        env:
          ARDUINOPATH_BOARDS: ${{ github.workspace }}/dist/ArduinoPath.app/Contents/Resources/boards.zip
        run: go test -v -timeout 120m -run TestRealBundle ./internal/arduino

      - name: Start ArduinoPath.app and use it
        env:
          ARDUINOPATH_EXPECT_TOOLS: "1"
        run: tests/macos/smoke.sh dist/ArduinoPath.app

      - name: Zip
        run: ditto -c -k --keepParent dist/ArduinoPath.app dist/ArduinoPath-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ArduinoPath-macOS.zip
          retention-days: 3

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          notes="**Windows:** download **ArduinoPath.exe** and double-click it (ArduinoPath-arm64.exe is for Windows laptops with ARM chips, such as Snapdragon).
          **Mac:** download **ArduinoPath-macOS.zip**, open it, and drag ArduinoPath into Applications (one app for Intel and Apple Silicon Macs).
          ArduinoPath opens in Chrome or Edge. Nothing to install, no admin rights needed. If Windows or macOS blocks it the first time, see docs/windows-app.md or docs/mac-app.md."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ArduinoPath $VERSION (Windows and Mac)" --notes "$notes" --latest
          fi
